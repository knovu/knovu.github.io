# Simple workflow for deploying static content to GitHub Pages using pnpm
name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Optional: Define job-specific environment variables
    env:
      VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout
        uses: actions/checkout@v5

      # 3️⃣ Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # 3️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      # 4️⃣ Install dependencies using pnpm
      - name: Install dependencies
        run: pnpm install

      # 5️⃣ Build your project
      - name: Build
        run: pnpm build

      # 6️⃣ Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7️⃣ Upload build artifact (dist folder)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      # 8️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
